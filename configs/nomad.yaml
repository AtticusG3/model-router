# nomad -- model-router v0.1 staged config (replaces llama-swap on 0.0.0.0:8081)
# Single model: Qwen3.5-9B Abliterated (TurboQuant vision) on the RTX A2000 8GB.
# Weights under /opt/ai/models/. Keep this node unlisted (like llama-swap's
# `unlisted: true`) so it only serves pool spillover, not direct listing.

listen: 0.0.0.0:8081
start_port: 5901

reserved_ports: []

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [qwen3.5-9b]

stanzas:
  - model_id: qwen3.5-9b
    name: "Qwen 3.5 9B Abliterated (TurboQuant vision)"
    command: >
      /opt/ai/bin/llama-server
      --model /opt/ai/models/llm/qwen35-9b-vision/Qwen3.5-9B-Abliterated-Claude-4.6-Opus-Reasoning-Distilled-v2.Q4_K_M.gguf
      --mmproj /opt/ai/models/llm/qwen35-9b-vision/mmproj-f16.gguf
      --port {port}
      --host 127.0.0.1
      --ctx-size 49152
      --n-gpu-layers 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v turbo4
      --cache-reuse 256
      --cont-batching
      --mlock
      --metrics
      --image-min-tokens 2048
      --temperature 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --repeat-penalty 1.0
      --presence-penalty 0.5
    vram_mb: 7000          # 5.4GB weights + 0.9GB mmproj + ctx headroom
    device: 0              # RTX A2000 Laptop (nvidia-smi index 0)
    spin_up_seconds: 60
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: true
    port: 5901

pools:
  coding-pool:
    strategy: spillover
    targets: [qwen3.5-9b, buster/qwopus-27b-coder-compat, digger/coding-model, gareths-homelab/llm-coding-model-waldron]
    spillover: 1
  daily-driver:
    strategy: spillover
    targets: [qwen3.5-9b, buster/agents-a1, digger/daily-model, gareths-homelab/llm-daily-driver-waldron]
    spillover: 1
  intent-router:
    strategy: spillover
    targets: [qwen3.5-9b, buster/intent-model, digger/intent-model, gareths-homelab/llm-intent-router-waldron]
    spillover: 2

peers:
  - name: buster
    kind: router
    base_url: http://192.168.1.61:18080
    models: [qwopus-27b-coder-compat, agents-a1, intent-model, qwen3-embedding-4b, jina-reranker-v3.5, qwen38-27b, ornith-35b, gemma-4-12b]
  - name: digger
    kind: router
    base_url: http://192.168.1.36:8082
    models: [coding-model, daily-model, intent-model, ornith-model]
  - name: gareths-homelab
    kind: router
    base_url: http://100.89.49.44:8081
    models: [llm-coding-model-waldron, llm-daily-driver-waldron, llm-intent-router-waldron]
  # nugget is OFFLINE (192.168.1.62, no route). Re-add when it returns:
  # - name: nugget
  #   kind: router
  #   base_url: http://192.168.1.62:8081
  #   models: [coding-model, daily-model, intent-model, agents-a1-model, fusion-heretic-model]
