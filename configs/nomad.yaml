# nomad -- model-router v0.1 staged config (replaces llama-swap on 0.0.0.0:8081)
# Single model: Qwen3.5-9B Abliterated (TurboQuant vision) on the RTX A2000 8GB.
# Weights under /opt/ai/models/. 2026-08-21: 49k turbo4 one slot used=6879.
# Weights under /opt/ai/models/. Chat template:
# /opt/ai/config/qwen-fixed-chat-template.jinja (froggeric v22.2).

listen: 0.0.0.0:8081
start_port: 5901

reserved_ports: []

catalog:
  # Hub links: the stanza's hf_repo gives the repo; the hub fills in owner,
  # params, licence and the icon, and the cache keeps those across restarts.
  hub: huggingface
  cache_file: /opt/ai/config/hub-cache.json

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [qwen3.5-9b]

stanzas:
  - model_id: qwen3.5-9b
    name: "Qwen 3.5 9B Abliterated (TurboQuant vision)"
    hf_repo: Qwen/Qwen3.5-9B
    aliases: [coding-pool, daily-driver, intent-router]
    command: >
      /opt/ai/bin/llama-server
      --model /opt/ai/models/llm/qwen35-9b-vision/Qwen3.5-9B-Abliterated-Claude-4.6-Opus-Reasoning-Distilled-v2.Q4_K_M.gguf
      --mmproj /opt/ai/models/llm/qwen35-9b-vision/mmproj-f16.gguf
      --port {port}
      --host 127.0.0.1
      --ctx-size 49152
      --n-gpu-layers 99
      --flash-attn on
      --cache-type-k turbo4
      --cache-type-v turbo4
      --cache-reuse 256
      --cont-batching
      --parallel 1
      --threads 2
      --batch-size 512
      --ubatch-size 128
      --mlock
      --metrics
      --jinja --chat-template-file /opt/ai/config/qwen-fixed-chat-template.jinja
      --reasoning-format deepseek
      --image-min-tokens 2048
      --temperature 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --repeat-penalty 1.0
      --presence-penalty 0.5
    vram_mb: 7400
    device: 0              # RTX A2000 Laptop (nvidia-smi index 0)
    spin_up_seconds: 60
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: true
    port: 5901

peers:
  - name: buster
    kind: router
    base_url: http://10.99.0.61:18080
  - name: digger
    kind: router
    base_url: http://10.99.0.36:8082
  - name: gareths-homelab
    kind: router
    base_url: http://203.0.113.44:8081
  - name: nugget
    kind: router
    base_url: http://10.99.0.62:8081
