# nomad -- model-router v0.1 staged config (replaces llama-swap on 0.0.0.0:8081)
# Single model: Qwen3.5-9B Abliterated (TurboQuant vision) on the RTX A2000 8GB.
# Weights under /opt/ai/models/.

listen: 0.0.0.0:8081
start_port: 5901

reserved_ports: []

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [qwen3.5-9b]

stanzas:
  - model_id: qwen3.5-9b
    name: "Qwen 3.5 9B Abliterated (TurboQuant vision)"
    aliases: [coding-pool, daily-driver, intent-router]
    command: >
      /opt/ai/bin/llama-server
      --model /opt/ai/models/llm/qwen35-9b-vision/Qwen3.5-9B-Abliterated-Claude-4.6-Opus-Reasoning-Distilled-v2.Q4_K_M.gguf
      --mmproj /opt/ai/models/llm/qwen35-9b-vision/mmproj-f16.gguf
      --port {port}
      --host 127.0.0.1
      --ctx-size 49152
      --n-gpu-layers 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v turbo4
      --cache-reuse 256
      --cont-batching
      --mlock
      --metrics
      --jinja --chat-template-file /opt/ai/config/qwen-fixed-chat-template.jinja
      --reasoning-format deepseek
      --image-min-tokens 2048
      --temperature 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --repeat-penalty 1.0
      --presence-penalty 0.5
    vram_mb: 7000          # 5.4GB weights + 0.9GB mmproj + ctx headroom
    device: 0              # RTX A2000 Laptop (nvidia-smi index 0)
    spin_up_seconds: 60
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: true
    port: 5901

peers:
  - name: buster
    kind: router
    base_url: http://192.168.1.61:18080
    models: [agents-a1, qwen3-0.6b-instruct, qwen3-embedding-4b, jina-reranker-v3.5,
             qwen3.8-27b, ornith-1.0-35b-heretic, qwen3.6-35b-a3b,
             krea-2-turbo, z-anime-turbo, ideogram4]
  - name: digger
    kind: router
    base_url: http://192.168.1.36:8082
    models: [qwen3-0.6b-instruct, qwen3.8-27b, ornith-1.0-35b-heretic,
             krea-2-turbo, z-anime-turbo, ideogram4]
  - name: gareths-homelab
    kind: router
    base_url: http://100.89.49.44:8081
    models: [qwen2.5-1.5b-instruct, ornith-1.0-35b, qwen3.6-35b-a3b,
             krea-2-turbo, z-anime-turbo, ideogram4]
  - name: nugget
    kind: router
    base_url: http://192.168.1.62:8081
    models: [agents-a1, qwen3-0.6b-instruct, qwen3-embedding-4b, jina-reranker-v3.5,
             ornith-1.0-35b-heretic, qwen3.8-27b, qwen3.6-35b-a3b,
             krea-2-turbo, z-anime-turbo, ideogram4]
