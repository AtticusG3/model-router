# digger -- model-router config for a small node.
# GPU changed: NVIDIA RTX 4060 8GB (was an RTX PRO 4000 24GB). Everything sized
# for 24GB is gone; this node keeps the CPU intent model and one small
# vision chat model that fits the card with headroom.
# 2026-11-22: pruned to that small set (Hermes, #repo-man). Peers are configured
# without `models` lists: routing follows each peer's advertised telemetry
# catalog, which is the documented behaviour for `kind: router` peers.

listen: 0.0.0.0:8082
start_port: 5950

reserved_ports: []   # sdcpp-webui runs on its own port (Gradio); verify with `ss -tlnp`

catalog:
  # Hub links: the stanza's hf_repo gives the repo; the hub fills in owner,
  # params, licence and the icon, and the cache keeps those across restarts.
  hub: huggingface
  cache_file: /opt/ai/config/hub-cache.json

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: []

stanzas:
  # ---------------- LLM (chat) ----------------
  - model_id: qwen3-0.6b-instruct
    name: "Qwen3 0.6B Instruct (intent)"
    hf_repo: Qwen/Qwen3-0.6B
    aliases: [intent-model, intent-router]
    command: >
      /opt/ai/bin/llama-server
      --model /srv/ssd/models/llm/intent-model/Qwen3-0.6B-Q4_K_M.gguf
      --port {port} --host 127.0.0.1
      --n-gpu-layers 0
      --threads 4
      --ctx-size 8192 --parallel 2 --n-predict 64
      --cont-batching --flash-attn off --metrics
      --temperature 0.1 --top-p 0.9 --top-k 20 --min-p 0.0
      --reasoning off
    vram_mb: 0
    device: 0
    spin_up_seconds: 30
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: true
    port: 5978

  # Qwen3-VL 8B Q4_K_M (4.7 GB) + a 0.7 GB Q8 mmproj leaves headroom on 8 GB.
  # Loaded on demand and unloaded after 15 min idle, so it does not hold VRAM on
  # a box that also runs media services.
  - model_id: qwen3-vl-8b
    name: "Qwen3-VL 8B Instruct (Q4_K_M, vision)"
    aliases: [vl-small, vision-small]
    command: >
      /opt/ai/bin/llama-server
      --model /srv/ssd/models/dit/boogu/Qwen3-VL-8B-Instruct-Q4_K_M.gguf
      --mmproj /srv/ssd/models/dit/boogu/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf
      --port {port} --host 127.0.0.1
      --n-gpu-layers 99
      --flash-attn on
      --ctx-size 16384 --parallel 1
      --cont-batching --metrics
      --cache-type-k q8_0 --cache-type-v q8_0
      --jinja
      --temperature 0.7 --top-p 0.8 --top-k 20 --min-p 0.0
    vram_mb: 7200
    device: 0
    spin_up_seconds: 90
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 900
    unlisted: false
    port: 5960

peers:
  - name: buster
    kind: router
    base_url: http://10.99.0.61:18080
  - name: nomad
    kind: router
    base_url: http://10.99.0.202:8081
  - name: gareths-homelab
    kind: router
    base_url: http://203.0.113.44:8081
  - name: nugget
    kind: router
    base_url: http://10.99.0.62:8081