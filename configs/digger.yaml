      --n-gpu-layers 0
      --threads 4
      --ctx-size 8192 --parallel 2 --n-predict 64
      --cont-batching --flash-attn off --metrics
      --temperature 0.1 --top-p 0.9 --top-k 20 --min-p 0.0
      --reasoning off
    vram_mb: 0
    device: 0
    spin_up_seconds: 30
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: true
    port: 5978

