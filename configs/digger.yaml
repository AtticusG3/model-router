pools:
  coding-pool:
    strategy: spillover
    targets: [qwopus-27b-coder, buster/qwopus-27b-coder-compat, gareths-homelab/llm-coding-model-waldron]
    spillover: 1
  daily-driver:
    strategy: spillover
    targets: [qwable-35b, buster/agents-a1, gareths-homelab/llm-daily-driver-waldron]
    spillover: 1
  intent-router:
    strategy: spillover
    targets: [intent-model, buster/intent-model, nomad/qwen3.5-9b]
    spillover: 2

peers:
  - name: buster
    kind: router
    base_url: http://192.168.1.61:18080
    models: [qwopus-27b-coder-compat, agents-a1, intent-model]
  - name: nomad
    kind: router
    base_url: http://192.168.1.202:8081
    models: [qwen3.5-9b]
  - name: gareths-homelab
