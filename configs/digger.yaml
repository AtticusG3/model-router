# digger -- model-router v0.1 staged config (replaces llama-swap on 0.0.0.0:8082)
# GPU: NVIDIA RTX PRO 4000 Blackwell 24GB. Image node (sd.cpp) + LLM stanzas.
# 2026-08-21: ornith 1x256k turbo4 MTP+mmproj (used=20689).
# qwen3.8-27b 1x128k turbo4 (256k lost, used=22753). Intent is CPU (ngl 0).
# ornith-1.5-35b-a3b-bigbang Q4_K_M 1x256k turbo4 no MTP (used=23788,
# delta=23063 over intent CUDA crumbs; 2x256k --ctx-size 524288 died).
# qwen3.8-27b uses /opt/ai/config/qwen-fixed-chat-template.jinja.
# Note: this node's sd.cpp stanzas share ONE /sdapi/v1 path; krea-2-turbo is the
# path_default (requests without a body `model` field land there). Clients that
# need a specific image model MUST send `"model": "<id>"` in the JSON body --
# this matches the current llama-swap behaviour (body-field-only matching).
#
# Aliases map legacy client ids (coding-pool, coding-model) onto the real
# model_id. Same finetune uses the same id on every node; see docs/vram-fit-ladder.md.
# All commands transcribed from llama-swap-sd.yaml (replacing ${PORT} with
# {port}).

listen: 0.0.0.0:8082
start_port: 5950

reserved_ports: []   # sdcpp-webui runs on its own port (Gradio); verify with `ss -tlnp`

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [qwen3-0.6b-instruct]

stanzas:
  # ---------------- LLM (chat) ----------------
  - model_id: ornith-1.0-35b-heretic
    name: "Ornith-1.0-35B-Heretic-MTP-APEX-I-Compact (agentic coding)"
    aliases: [ornith-1.0-35b-heretic-compact, ornith-1.0-35b-heretic-quality, ornith-model, daily-driver, daily-model]
    command: >
      /opt/ai/bin/llama-server
      --model /srv/ssd/models/llm/Ornith-1.0-35B-Heretic-MTP-APEX-I-Compact.gguf
      --mmproj /srv/ssd/models/llm/mmproj-Ornith-1.0-35B-Heretic-MTP-APEX-I-Compact-F16.gguf --no-mmproj-offload
      --port {port} --host 127.0.0.1
      --n-gpu-layers 99
      --ctx-size 262144 --threads 4 --parallel 1 --cont-batching --flash-attn on
      --cache-type-k turbo4 --cache-type-v turbo4 --cache-reuse 256
      --batch-size 512 --ubatch-size 512
      --jinja --metrics --no-mmap --mlock
      --spec-type draft-mtp --spec-draft-n-max 2
      --n-predict 65536 --reasoning-budget 53248 --reasoning-budget-message "[[SYSTEM] You have run out of thinking time. Stop reasoning immediately and provide your final code solution now, based on your best understanding so far.]"
      --temperature 0.6 --top-p 0.95 --top-k 20
    vram_mb: 21200
    device: 0
    spin_up_seconds: 120
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: true
    port: 5971

  - model_id: ornith-1.5-35b-a3b-bigbang
    name: "Ornith-1.5-35B-A3B-BigBang Q4_K_M"
    command: >
      /opt/ai/bin/llama-server
      --model /srv/ssd/models/llm/Ornith-1.5-35B-A3B-BigBang-MTP-Q4_K_M.gguf
      --port {port} --host 127.0.0.1
      --n-gpu-layers 99
      --ctx-size 262144 --threads 3 --parallel 1 --cont-batching --flash-attn on
      --cache-type-k turbo4 --cache-type-v turbo4 --cache-reuse 256
      --batch-size 512 --ubatch-size 512
      --jinja --metrics --no-mmap --mlock
      --n-predict 65536
      --temperature 0.6 --top-p 0.95 --top-k 20 --min-p 0.0
    vram_mb: 23200
    device: 0
    spin_up_seconds: 120
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: true
    port: 5972

  - model_id: qwen3.8-27b
    name: "Qwen3.8 27B (UD-Q5_K_XL)"
    aliases: [coding-pool]
    command: >
      /opt/ai/bin/llama-server
      --model /srv/ssd/models/llm/Qwen3.8-27B-UD-Q5_K_XL.gguf
      --port {port} --host 127.0.0.1
      --n-gpu-layers 99
      --ctx-size 131072 --threads 2 --parallel 1 --cont-batching --flash-attn on
      --cache-type-k turbo4 --cache-type-v turbo4 --cache-reuse 256
      --batch-size 512 --ubatch-size 128
      --jinja --chat-template-file /opt/ai/config/qwen-fixed-chat-template.jinja
      --reasoning-format deepseek --metrics --no-mmap --mlock
      --spec-type draft-mtp --spec-draft-n-max 3
      --n-predict 65536 --reasoning-budget 53248 --reasoning-budget-message "[[SYSTEM] You have run out of thinking time. Stop reasoning immediately and provide your final code solution now, based on your best understanding so far.]"
      --temperature 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
    vram_mb: 23300
    device: 0
    spin_up_seconds: 90
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: true
    port: 5973

  - model_id: qwen3-0.6b-instruct
    name: "Qwen3 0.6B Instruct (intent)"
