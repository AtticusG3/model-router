# digger -- model-router v0.1 staged config (replaces llama-swap on 0.0.0.0:8082)
# GPU: NVIDIA RTX PRO 4000 Blackwell 24GB. Image node (sd.cpp) + LLM stanzas.
# Note: this node's sd.cpp stanzas share ONE /sdapi/v1 path; krea-2-turbo is the
# path_default (requests without a body `model` field land there). Clients that
# need a specific image model MUST send `"model": "<id>"` in the JSON body --
# this matches the current llama-swap behaviour (body-field-only matching).
#
# Aliases map the generic ids peers reference (coding-model, daily-model,
# ornith-model) to this node's actual stanza ids.
# All commands transcribed from llama-swap-sd.yaml (replacing ${PORT} with
# {port}).

listen: 0.0.0.0:8082
start_port: 5950

reserved_ports: []   # sdcpp-webui runs on its own port (Gradio); verify with `ss -tlnp`

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [qwopus-27b-coder]

stanzas:
  # ---------------- LLM (chat) ----------------
  - model_id: qwopus-27b-coder
    name: "Qwopus3.6-27B-Coder-MTP Q4_K_M (coding)"
    aliases: [coding-model]
    command: >
      /opt/ai/bin/llama-server
      --model /srv/ssd/models/llm/Qwopus3.6-27B-Coder-MTP-Q4_K_M.gguf
      --mmproj /srv/ssd/models/llm/mmproj-Qwopus3.6-27B-Coder-MTP-F32.gguf --no-mmproj-offload
      --port {port} --host 127.0.0.1
      --n-gpu-layers 99
      --ctx-size 196608 --threads 4 --parallel 1 --cont-batching --flash-attn on
      --cache-type-k q8_0 --cache-type-v turbo3 --cache-reuse 256
      --jinja --metrics --no-mmap --mlock
      --spec-type draft-mtp --spec-draft-n-max 4
      --n-predict 49152 --reasoning-budget 36864 --reasoning-budget-message "[[SYSTEM] You have run out of thinking time. Stop reasoning immediately and provide your final code solution now, based on your best understanding so far.]"
      --temperature 0.2 --top-p 0.9 --top-k 20 --min-p 0.0
    vram_mb: 18000
    device: 0
    spin_up_seconds: 90
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: true
    port: 5975

