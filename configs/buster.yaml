# buster -- model-router on 0.0.0.0:18080
#
# GPU map: nvidia-smi 0 = RTX 4060 8GB, nvidia-smi 1 = Tesla V100 32GB.
# llama.cpp: CUDA0 = 4060, CUDA1 = V100 (same order as nvidia-smi).
# Rag-proxy / Open WebUI / Hermes talk to :18080.
#
# vram_mb is nvidia-smi used rounded up after a successful ladder load
# (docs/vram-fit-ladder.md). Chat + image on V100; specialists on 4060.
# 2026-08-21 per-slot walk: MoE qwen3.6 is 2x256k (--ctx-size 524288
# --parallel 2, used=29713). ornith-1.5 Q5 grafted MTP is 2x256k
# (used=32099). Dense chat is one 256k slot. Specialists on 4060
# unchanged. Qwen 3.6/3.8 use qwen-fixed-chat-template.jinja.

listen: 0.0.0.0:18080
start_port: 5901
reserved_ports: [8081, 6333, 18095, 18096, 18097, 8082, 18099, 18100]

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [agents-a1, qwen3-0.6b-instruct, qwen3-embedding-4b, jina-reranker-v3.5]

stanzas:
  - model_id: agents-a1
    name: "Agents-A1-Uncensored-MTP-APEX-I-Quality (agentic coding)"
    aliases: [daily-driver]
    command: >
      /opt/ai/bin/llama-server
      --model /home/kevyn/models/Agents-A1-Uncensored-MTP-APEX-I-Quality.gguf
      --mmproj /home/kevyn/models/mmproj-Agents-A1-Uncensored-MTP-BF16.gguf
      --port {port} --host 127.0.0.1
      --n-gpu-layers 999
      --ctx-size 262144 --threads 3 --parallel 1 --cont-batching --flash-attn on
      --cache-type-k turbo4 --cache-type-v turbo4
      --cache-reuse 256 --batch-size 512 --ubatch-size 512 --metrics
      --spec-type draft-mtp --spec-draft-n-max 4
      --n-predict 65536 --reasoning-budget 53248 --reasoning-budget-message "[[SYSTEM] You have run out of thinking time. Stop reasoning immediately and provide your final code solution now, based on your best understanding so far.]"
      --temperature 0.85 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.1 --repeat-penalty 1.0
      --split-mode none --device CUDA1
    vram_mb: 27500
    device: 1
    spin_up_seconds: 90
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: true
    port: 5901

  - model_id: qwen3-0.6b-instruct
    name: "Qwen3 0.6B Instruct (intent)"
    aliases: [intent-model, intent-router]
    command: >
      /opt/ai/bin/llama-server
      --model /home/kevyn/models/llm/intent-model/Qwen3-0.6B-Q4_K_M.gguf
      --port {port} --host 127.0.0.1
      --n-gpu-layers 999
      --ctx-size 8192 --threads 2 --parallel 2 --cont-batching --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --n-predict 64
      --metrics
      --temperature 0.1 --top-p 0.9 --top-k 20 --min-p 0.0
      --reasoning off
      --split-mode none --device CUDA0
    env: ["CUDA_VISIBLE_DEVICES=0"]
    vram_mb: 1500
    device: 0
    spin_up_seconds: 30
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: true
    port: 5903

  - model_id: qwen3-embedding-4b
    name: "Qwen3 Embedding 4B"
    aliases: [embed-pool]
