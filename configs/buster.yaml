      -W 1024 -H 1024
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES={gpu}", "GGML_CUDA_PDL=0"]
    vram_mb: 20000
    device: "0|1|2"
    spin_up_seconds: 60
    api_type: image
    match: {path_prefix: /sdapi/v1}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: false
    port: 5918

  - model_id: ideogram4
    name: "Ideogram 4"
    command: >
      /opt/ai/bin/sd-router-shim {port} --prompt-enhance --
      /home/kevyn/infra/stable-diffusion.cpp/build/bin/sd-server
      --diffusion-model /home/kevyn/models/ideogram4/ideogram4-Q8_0.gguf
      --uncond-diffusion-model /home/kevyn/models/ideogram4/ideogram4_uncond-Q8_0.gguf
