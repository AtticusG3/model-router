  # --- multimodal backends (epic #64) -------------------------------------
  # #74 transcription: whisper.cpp whisper-server, docs/research/stt-backends.md.
  # The binary is built for sm_70 + sm_86. The two path flags move the OpenAI
  # routes onto the paths the router proxies; without them the backend answers
  # 404 for /v1/audio/transcriptions. --request-path also moves /health to
  # /v1/audio/health, which is what health_check points at (503 until the
  # weights are in). The backend ignores the multipart "model" field, so the
  # router's match resolves the stanza and the value is otherwise unused.
  - model_id: whisper-large-v3-turbo
    name: "Whisper large-v3 Turbo (ggml Q5_0, STT)"
    aliases: [whisper-1, stt, transcription]
    command: >
      /opt/ai/bin/whisper-server
      --model /opt/ai/models/stt/ggml-large-v3-turbo-q5_0.bin
      --vad-model /opt/ai/models/stt/ggml-silero-v6.2.0.bin
      --host 127.0.0.1 --port {port}
      --request-path /v1/audio --inference-path /transcriptions
      --language auto --convert --vad --flash-attn --threads 8
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES={gpu}"]
    # Measured 21 Nov 2026 on GPU0: 4943 MiB residents before load, 5988 loaded
    # idle, 6048 peak mid-inference (30 min file) => 1105 MiB process footprint.
    vram_mb: 1200
    device: 0
    spin_up_seconds: 60
    api_type: transcription
    match: {body_field: model}
    health_check: /v1/audio/health
    idle_ttl_seconds: 300
    slots: 1
    unlisted: false
    port: 5930

  # #79 speech + voice cloning: vLLM-Omni serving Qwen3-TTS 1.7B Base on GPU0.
  # vLLM-Omni needs compute capability 7.5+, so this stanza cannot move to a
  # V100 (sm_70) -- unlike the image stanzas it is 3090-only.
  # --served-model-name must equal model_id: the router rewrites no model id for
  # a local stanza, and vLLM answers 404 for a name it does not serve.
  # The per-stage budgets (0.30 talker + 0.10 codec decoder of the card) live in
  # the deploy file, not on the command line, because the router's command
  # splitter drops double quotes.
  - model_id: qwen3-tts-1.7b
    name: "Qwen3-TTS 1.7B Base (voice clone, vLLM-Omni, speech)"
    command: >
      /opt/ai/venv-vllm-omni/bin/vllm serve /opt/ai/models/tts/Qwen3-TTS-12Hz-1.7B-Base
      --omni
      --deploy-config /opt/ai/config/vllm-omni/qwen3_tts_24gb.yaml
      --served-model-name qwen3-tts-1.7b
      --host 127.0.0.1 --port {port}
      --trust-remote-code --enforce-eager
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES=0",
          "HF_HOME=/opt/ai/hf/tts", "HF_HUB_OFFLINE=1"]
    vram_mb: 9000
    device: 0
    spin_up_seconds: 300
    api_type: speech
    capabilities: [audio_out]
    match: {path_prefix: /v1/audio/voices, path_default: true}
    health_check: /health
    idle_ttl_seconds: 900
    # Cold start is ~90 s (two vLLM stages). Without a hold, admission picked
    # this stanza as the cheapest eviction 2 s after it reported ready, so the
    # first client still paid a reload. 180 s covers time-to-first-client.
    hold_seconds: 180
    slots: 4
    unlisted: false
    port: 5933

  # #82 realtime: speech-to-speech (HF voice agent) as one process on GPU0.
  # In-process VAD (silero) + faster-whisper tiny.en + Kokoro 82M, and the LLM
  # is a router chat stanza -- so this adds two small models, never a third
  # copy of an LLM. Speaks the OpenAI Realtime GA core subset on /v1/realtime.
  # Path/default are set, so a model-less ws upgrade lands here.
  # miss: --stt faster-whisper / --tts kokoro need the package extras
  # ("speech-to-speech[faster-whisper,kokoro]"), and the kokoro frontend shells
  # out to `uv pip install` for its spacy model, so PYTHONPATH-free VIRTUAL_ENV
  # and PATH must be real: without them the spawn dies with "spaCy requires
  # either pip or uv to download models".
  # health is /docs: FastAPI's page appears only after the handlers are built.
  - model_id: voice-cascade
    name: "Voice cascade (faster-whisper + Kokoro, LLM via router, realtime)"
    command: >
      /usr/bin/env VIRTUAL_ENV=/opt/ai/venv-s2s
      PATH=/opt/ai/venv-s2s/bin:/home/kevyn/.local/bin:/usr/local/bin:/usr/bin:/bin
      HF_HOME=/opt/ai/hf/s2s CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=0
      /opt/ai/venv-s2s/bin/speech-to-speech serve
      --host 127.0.0.1 --port {port}
      --device cuda
      --stt faster-whisper --tts kokoro
      --llm_backend chat-completions
      --responses_api_base_url http://127.0.0.1:18080/v1
      --responses_api_api_key unused
      --model_name qwen38-flash-next
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES=0", "HF_HOME=/opt/ai/hf/s2s"]
    vram_mb: 2000
    device: 0
    spin_up_seconds: 180
    api_type: realtime
    capabilities: [audio_in, audio_out, tools]
