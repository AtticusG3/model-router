# buster -- model-router on 0.0.0.0:18080
#
# nvidia-smi / llama.cpp:
#   GPU0 = RTX 3090 24GB (sm_86, NUMA 0) -- ttl=0 residents + image models
#   GPU1 = Tesla V100 32GB (sm_70, NUMA 1) -- chat / coding / image
#   GPU2 = Tesla V100 32GB (sm_70, NUMA 1) -- chat / coding / image
# V100 chat stanzas use device: "1|2". Image stanzas use "0|1|2" (20 Nov 2026):
# sd-server is built for sm_70 + sm_86 (verified with cuobjdump), so the 3090
# can run them; krea2-ostris-edit (28GB torch server) stays on "1|2". The router places each load on whichever
# V100 fits (a free card first, then the tightest fit; eviction only touches
# the chosen card) and fills CUDA_VISIBLE_DEVICES={gpu} at spawn, so
# --device CUDA0 inside the process is that card. CUDA_DEVICE_ORDER=PCI_BUS_ID
# keeps CUDA numbering equal to nvidia-smi. Do not drop CVD on those stanzas.
# max_instances: 2 starts a second copy on the other V100 when every copy is
# busy and that card has room without evicting; each copy idles out alone.
# 3090 trio (intent/embed/rerank) ~6.6GB resident; ~18GB free on the 3090.
# Flash-Next (qwen38-flash-next) is Strata-V100, not llama.cpp. It takes both
# V100s (device: "1,2", vram_mb 64000, layer split 24, context 262144).
# The 3090 trio is not part of that load. Do not put {gpu} on this stanza.
# idle_ttl 0: the reaper does not unload it. It was pinned (pin: true) from
# 11 Nov 2026 so a load that could not fit without it failed instead of pulling
# the review backend out from under the PR review bot on digger. Unpinned on
# 20 Nov 2026 (Kevyn): anything may be evicted to fit an image load, including
# this model and qwen3-embedding-4b. Image loads prefer the 3090 (the eviction
# picker takes the card needing the fewest MB evicted, normally the 3090 and at
# most the 3.6GB embedding), so qwen is only evicted if the 3090 cannot take
# the model. Preload restore after an eviction is kevyn/model-router#63; until
# then it reloads on its next request (~7 min cold start). Preloaded with the
# embedding model.
# Its vision encoder starts lazy (deploy/strata-router.json vision.lazy) and
# idles out after 300s, so it is not resident beside the text engine.

# CPU affinity (5 Nov 2026): qwen38-flash-next and deepseek-v4.1-flash-ista-das-coder
# share buster's 56 logical CPUs (28 physical). Each gets 13 physical cores (26 logical),
# NUMA-aligned to its GPUs, leaving 2 physical cores for the system:
#   system free: 13,27,41,55 (pkg0 core14 + pkg1 core14)
#   deepseek-v4.1-flash-ista-das-coder (RTX 3090, NUMA0): taskset -c 0-12,28-40
#   qwen38-flash-next (dual V100, NUMA1): taskset -c 14-26,42-54
# Live taskset applied to running processes the same day; model-router must be
# restarted (or the stanza respawned) for these wrappers to take effect on new spawns.

listen: 0.0.0.0:18080
start_port: 5901
# Voice library (#78/#79): a cloned voice is one WAV plus a JSON sidecar
# under this directory, so it survives a router restart. A model-less
# POST /v1/audio/voices stores here; a speech request whose "voice" is a
# library id gets ref_audio + ref_text injected from the clip.
voice_dir: /opt/ai/voices

reserved_ports: [8081, 6333, 18095, 18096, 18097, 8082, 18099, 18100,
                 5930, 5931, 5932, 5933, 5934, 5935, 5936, 5937, 5938,
                 5939, 5940, 5941, 5942, 5943, 5944, 5945, 5946, 5947,
                 5948, 5949]

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [qwen3-embedding-4b, qwen38-flash-next]

stanzas:
  - model_id: qwen38-flash-next
    # v3.1 (Q4_XS, 4 shards) was rolled back to v3.0 on 13 Nov 2026: tool calling
    # failed on the v3.1 quant, suspected to be the Q2 tensors packed inside a
    # Q4_XS build. Do not point this stanza at v3.1 again without re-testing tool
    # calls end to end. The v3.1 pack and model dir are deleted; only v3.0 remains.
    # Name change takes effect on the next model-router restart, not on reload.
    name: "Qwen3.8 Flash-Next 125B A6B UD-IQ4_XS Dynamic v3.0 (Strata-V100, 256k, dual V100)"
    aliases: [qwen3.8-flash-next]
    command: >
      taskset -c 14-26,42-54
      /home/kevyn/infra/Strata-V100-102a14df/.venv/bin/python
      /home/kevyn/infra/Strata-V100-102a14df/serve/server.py
      --engine strata --config /home/kevyn/infra/Strata-V100-102a14df/deploy/strata-router.json
      --port {port}
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID"]
    vram_mb: 64000
    device: "1,2"
    spin_up_seconds: 420
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    # Evictable as a last resort (20 Nov 2026, Kevyn): image gen may take its
    # place. A reload costs ~7 min of no reviews, so the picker only gets here
    # when the 3090 cannot take the image model. Restore: model-router#63.
    pin: false
    unlisted: false
    port: 5927

