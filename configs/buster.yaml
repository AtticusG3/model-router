      --n-gpu-layers 999
      --ctx-size 8192 --threads 2 --parallel 2 --cont-batching --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --metrics --embedding
      --split-mode none --device CUDA0
    env: ["CUDA_VISIBLE_DEVICES=0"]
    vram_mb: 3600
    device: 0
    spin_up_seconds: 30
