      /home/kevyn/infra/Strata-V100-102a14df/serve/server.py
      --engine strata --config /home/kevyn/infra/Strata-V100-102a14df/deploy/swift15-iq3s.json
      --port {port}
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID"]
    vram_mb: 55000
    device: "0,1"
    spin_up_seconds: 420
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
