    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES={gpu}", "GGML_CUDA_PDL=0", "SHIM_ENHANCER_URL=http://127.0.0.1:18080/v1", "SHIM_ENHANCER_TIMEOUT=20"]
    vram_mb: 22000
    device: "0|1|2"
    spin_up_seconds: 60
    api_type: image
    match: {path_prefix: /sdapi/v1}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: false
    port: 5919

  - model_id: qwen-image-2.1
