# buster -- model-router on 0.0.0.0:18080
#
# nvidia-smi / llama.cpp:
#   GPU0 = RTX 3090 24GB (sm_86, NUMA 0) -- ttl=0 residents only
#   GPU1 = Tesla V100 32GB (sm_70, NUMA 1) -- chat / coding / image
#   GPU2 = Tesla V100 32GB (sm_70, NUMA 1) -- chat / coding / image
# V100 stanzas use device: "1|2". The router places each load on whichever
# V100 fits (a free card first, then the tightest fit; eviction only touches
# the chosen card) and fills CUDA_VISIBLE_DEVICES={gpu} at spawn, so
# --device CUDA0 inside the process is that card. CUDA_DEVICE_ORDER=PCI_BUS_ID
# keeps CUDA numbering equal to nvidia-smi. Do not drop CVD on those stanzas.
# max_instances: 2 starts a second copy on the other V100 when every copy is
# busy and that card has room without evicting; each copy idles out alone.
# 3090 trio (intent/embed/rerank) ~6.6GB resident; ~18GB free on the 3090.
# Flash-Next pins device: "0,1,2". Admission splits vram_mb by free VRAM, so
# the trio stays and the two V100s take the larger share. vram_mb 80000 fits
# in that leftover pool; a V100 occupant is evicted first, the trio is not.
# llama.cpp --fit on owns placement; do not also set ngl / tensor-split /
# override-tensor (fit aborts, then CUDA0 OOMs). Do not set
# CUDA_VISIBLE_DEVICES on Flash-Next.

listen: 0.0.0.0:18080
start_port: 5901
reserved_ports: [8081, 6333, 18095, 18096, 18097, 8082, 18099, 18100]

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [dsv4-flash-vision]

stanzas:
  # DeepSeek V4 Flash Vision REAP abliterated. All three GPUs.
  # Residents are not preloaded so this 78GB GGUF can take the cards.
  - model_id: dsv4-flash-vision
    name: "DeepSeek V4 Flash Vision (REAP, abliterated)"
    aliases: [deepseek-v4-flash-vision]
    command: >
      /home/kevyn/infra/llama.cpp-dsv4/build/bin/llama-server
      --model /home/kevyn/models/dsv4-vision-reap-abliterated.gguf
      --mmproj /home/kevyn/models/mmproj-dsv4-vision-reap-abliterated.gguf
      --port {port} --host 127.0.0.1
      --alias dsv4-flash-vision,deepseek-v4-flash-vision
      --fit on
      --ctx-size 65536
      --split-mode layer
      --parallel 1 --cont-batching --flash-attn on
      --threads 28 --threads-batch 28
      --cpu-range 0-27 --cpu-range-batch 0-55 --cpu-strict 1
      --batch-size 2048 --ubatch-size 512
      --cache-type-k q8_0 --cache-type-v q8_0
      --jinja --metrics
      --n-predict 16384
      --temperature 0.6 --top-p 0.95 --top-k 40 --min-p 0.0
    env: ["GGML_CUDA_PDL=0"]
    vram_mb: 86000
    device: "0,1,2"
    spin_up_seconds: 600
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: false
    port: 5925

  # Qwen3.8 Flash-Next UD-IQ4_XS. --fit on, 256k ctx, all three GPUs.
  # Quality load (not GSQ Q2). device "0,1,2" + vram_mb 80000 uses leftover
  # 3090 VRAM plus both V100s and leaves the ttl=0 trio resident.
  - model_id: qwen38-flash-next
    name: "Qwen3.8 Flash-Next 125B A6B UD-IQ4_XS"
    aliases: [qwen3.8-flash-next]
    command: >
