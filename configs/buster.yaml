      --model /opt/ai/models/qwen3.8-flash-next-uncensored/Qwen3.8-Flash-Next-Uncensored-IQ4_XS-00001-of-00003.gguf
      --mmproj /opt/ai/models/qwen3.8-flash-next-uncensored/mmproj-Qwen3.8-Flash-Next-Uncensored-F16.gguf
      --port {port} --host 127.0.0.1
      --alias qwen3.8-flash-next,qwen38-flash-next
      --fit on --ctx-size 262144
      --split-mode layer
      --load-mode none --parallel 1 --cont-batching --flash-attn on
      --threads 28 --threads-batch 28
      --cpu-range 0-27 --cpu-range-batch 0-55 --cpu-strict 1
      --batch-size 2048 --ubatch-size 512
      --cache-type-k q4_0 --cache-type-v q4_0
      --tools all
      --jinja --metrics --reasoning-format deepseek --reasoning-preserve
      --n-predict 8192
      --temperature 0.7 --top-p 0.8 --top-k 20 --min-p 0.0
    env: ["GGML_CUDA_PDL=0", "LLAMA_ATTN_ROT_DISABLE=1"]
    vram_mb: 80000
    device: "0,1,2"
    spin_up_seconds: 300
