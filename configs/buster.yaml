  # --- multimodal backends (epic #64) -------------------------------------
  # #74 transcription: whisper.cpp whisper-server, docs/research/stt-backends.md.
  # The binary is built for sm_70 + sm_86. The two path flags move the OpenAI
  # routes onto the paths the router proxies; without them the backend answers
  # 404 for /v1/audio/transcriptions. --request-path also moves /health to
  # /v1/audio/health, which is what health_check points at (503 until the
  # weights are in). The backend ignores the multipart "model" field, so the
  # router's match resolves the stanza and the value is otherwise unused.
  - model_id: whisper-large-v3-turbo
    name: "Whisper large-v3 Turbo (ggml Q5_0, STT)"
    hf_repo: openai/whisper-large-v3-turbo
    aliases: [whisper-1, stt, transcription]
    command: >
      /opt/ai/bin/whisper-server
      --model /opt/ai/models/stt/ggml-large-v3-turbo-q5_0.bin
      --vad-model /opt/ai/models/stt/ggml-silero-v6.2.0.bin
      --host 127.0.0.1 --port {port}
      --request-path /v1/audio --inference-path /transcriptions
      --language auto --convert --vad --flash-attn --threads 8
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES={gpu}"]
    # Measured 21 Nov 2026 on GPU0: 4943 MiB residents before load, 5988 loaded
    # idle, 6048 peak mid-inference (30 min file) => 1105 MiB process footprint.
    vram_mb: 1200
    device: 0
    spin_up_seconds: 60
    api_type: transcription
    match: {body_field: model}
    health_check: /v1/audio/health
    idle_ttl_seconds: 300
    slots: 1
    unlisted: false
    port: 5930

  # #79 speech + voice cloning: vLLM-Omni serving Qwen3-TTS 1.7B Base on GPU0.
  # vLLM-Omni needs compute capability 7.5+, so this stanza cannot move to a
  # V100 (sm_70) -- unlike the image stanzas it is 3090-only.
  # --served-model-name must equal model_id: the router rewrites no model id for
  # a local stanza, and vLLM answers 404 for a name it does not serve.
  # The per-stage budgets (0.30 talker + 0.10 codec decoder of the card) live in
  # the deploy file, not on the command line, because the router's command
  # splitter drops double quotes.
  - model_id: qwen3-tts-1.7b
    name: "Qwen3-TTS 1.7B Base (voice clone, vLLM-Omni, speech)"
    hf_repo: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    command: >
      /opt/ai/venv-vllm-omni/bin/vllm serve /opt/ai/models/tts/Qwen3-TTS-12Hz-1.7B-Base
      --omni
      --deploy-config /opt/ai/config/vllm-omni/qwen3_tts_24gb.yaml
      --served-model-name qwen3-tts-1.7b
      --host 127.0.0.1 --port {port}
      --trust-remote-code --enforce-eager
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES=0",
          "HF_HOME=/opt/ai/hf/tts", "HF_HUB_OFFLINE=1"]
    vram_mb: 9000
    device: 0
    spin_up_seconds: 300
    api_type: speech
    capabilities: [audio_out]
    match: {path_prefix: /v1/audio/voices, path_default: true}
    health_check: /health
    idle_ttl_seconds: 900
    # Cold start is ~90 s (two vLLM stages). Without a hold, admission picked
    # this stanza as the cheapest eviction 2 s after it reported ready, so the
    # first client still paid a reload. 180 s covers time-to-first-client.
    hold_seconds: 180
    slots: 4
    unlisted: false
    port: 5933

  # #82 realtime: speech-to-speech (HF voice agent) as one process on GPU0.
  # In-process VAD (silero) + faster-whisper tiny.en + Kokoro 82M, and the LLM
  # is a router chat stanza -- so this adds two small models, never a third
  # copy of an LLM. Speaks the OpenAI Realtime GA core subset on /v1/realtime.
  # Path/default are set, so a model-less ws upgrade lands here.
  # miss: --stt faster-whisper / --tts kokoro need the package extras
  # ("speech-to-speech[faster-whisper,kokoro]"), and the kokoro frontend shells
  # out to `uv pip install` for its spacy model, so PYTHONPATH-free VIRTUAL_ENV
  # and PATH must be real: without them the spawn dies with "spaCy requires
  # either pip or uv to download models".
  # health is /docs: FastAPI's page appears only after the handlers are built.
  - model_id: voice-cascade
    name: "Voice cascade (faster-whisper + Kokoro, LLM via router, realtime)"
    command: >
      /usr/bin/env VIRTUAL_ENV=/opt/ai/venv-s2s
      PATH=/opt/ai/venv-s2s/bin:/home/kevyn/.local/bin:/usr/local/bin:/usr/bin:/bin
      HF_HOME=/opt/ai/hf/s2s CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=0
      /opt/ai/venv-s2s/bin/speech-to-speech serve
      --host 127.0.0.1 --port {port}
      --device cuda
      --stt faster-whisper --tts kokoro
      --llm_backend chat-completions
      --responses_api_base_url http://127.0.0.1:18080/v1
      --responses_api_api_key unused
      --model_name qwen38-flash-next
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES=0", "HF_HOME=/opt/ai/hf/s2s"]
    vram_mb: 2000
    device: 0
    spin_up_seconds: 180
    api_type: realtime
    capabilities: [audio_in, audio_out, tools]
    match: {path_default: true}
    health_check: /docs
    idle_ttl_seconds: 900
    hold_seconds: 120
    slots: 1
    unlisted: false
    port: 5936

  # #79 second speech option: KittenTTS 2 (1.7B ternary body, 954 MB packed,
  # 115 built-in voices, in-context cloning from a 5-30 s reference).
  # The `kittenml` package is a library and the vendor's own server is a
  # separate module, so deploy/kitten-tts-shim/server.py is the OpenAI-shaped
  # front end the router needs. Upstream does ship an OpenAI-compatible server
  # (python -m kittenml.kittentts2.docker.server) but it takes `voice` as a
  # dict, not the ref_audio/ref_text pair this router injects.
  # Deps are pinned on purpose: torch 2.15 / transformers 5.24 make this
  # checkpoint emit ~16 codec frames and stop (0.5 s of noise) -- torch 2.11.0
  # + transformers 5.22.2 + huggingface_hub 2.4.0 generate normally.
  - model_id: kitten-tts-2
    name: "KittenTTS 2 (1.7B ternary, 115 voices, clone from 5-30 s)"
    hf_repo: KittenML/kitten-tts-2
    command: >
      /usr/bin/env VIRTUAL_ENV=/opt/ai/venv-kitten
      PATH=/opt/ai/venv-kitten/bin:/usr/local/bin:/usr/bin:/bin
      HF_HOME=/opt/ai/hf/tts KITTEN_MODEL_DIR=/opt/ai/models/tts/kitten-tts-2
      KITTEN_DEVICE=cuda CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=0
      /opt/ai/venv-kitten/bin/python -m uvicorn
      --app-dir /home/kevyn/projects/model-router/deploy/kitten-tts-shim
      server:app --host 127.0.0.1 --port {port}
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES=0", "HF_HOME=/opt/ai/hf/tts"]
    vram_mb: 5000
    device: 0
    spin_up_seconds: 120
    api_type: speech
    health_check: /health
    idle_ttl_seconds: 900
    hold_seconds: 120
    slots: 1
    unlisted: false
    port: 5934

  # #86 video: LTX-2.5 22B distilled (Q5_K_M) with the conv video VAE, the
  # audio VAE and a Q8_0 Gemma4-12B text encoder. sd.cpp writes webm/webp/avi
  # only, so the router's sdcpp job adapter serves webm unchanged and remuxes
  # to H.264+AAC mp4 when a client asks for it (?format=mp4 or Accept:
  # video/mp4) -- a WebM with PCM audio plays silent in browsers (#2233).
  - model_id: ltx-2.5-video
    name: "LTX-2.5 22B distilled (text/image to audio-video, sd.cpp)"
    hf_repo: Lightricks/LTX-2.5
    command: >
      /home/kevyn/infra/stable-diffusion.cpp/build-video/bin/sd-server
      --diffusion-model /opt/ai/models/video/ltx-2.5/distilled/ltx-2.5-22b-distilled-Q5_K_M.gguf
      --vae /opt/ai/models/video/ltx-2.5/vae/ltx-2.5-video-vae-conv-bf16.safetensors
      --audio-vae /opt/ai/models/video/ltx-2.5/vae/ltx-2.5-audio-vae-bf16.safetensors
      --llm /opt/ai/models/video/ltx-2.5/te/gemma4-12b-with-proj-ltx-2.5-Q8_0.gguf
      --diffusion-fa
      --offload-to-cpu
      --vae-tiling
      --temporal-tiling
      --mmap
      --max-pending-jobs 2
      --completed-ttl-seconds 900
      --threads 14
      -l 127.0.0.1 --listen-port {port}
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES=0", "GGML_CUDA_PDL=0"]
    vram_mb: 19000
    device: 0
    spin_up_seconds: 120
    api_type: video
    capabilities: [audio_out]
    job:
      adapter: sdcpp
    match: {path_default: true}
    health_check: /sdapi/v1/sd-models
    idle_ttl_seconds: 300
    slots: 1
    unlisted: false
    port: 5938

  # #89 music: ACE-Step 1.5 turbo (2B DiT) + the 0.6B planning LM, behind a
  # small OpenAI-shaped shim that turns the router's audio_gen job API into
  # ACE-Step's own task API (/release_task, /query_result, /v1/audio?path=).
  # The upstream 1.7B LM repo in the research note does not exist on HF
  # (ACE-Step/acestep-5Hz-lm-1.7B is a 404); 0.6B and 4B are the published ones.
  # torch is pinned to 2.11.0+cu130 in its own venv: the locked 2.10.0+cu128
  # build fails every bf16 GEMM on this box with CUBLAS_STATUS_INVALID_VALUE.
  # cu130 has no sm_70, so this stanza is GPU0 only; a V100 placement would
  # need a second venv on cu128.
  - model_id: ace-step-music
    name: "ACE-Step 1.5 turbo (music, 10-600 s, 48 kHz stereo)"
    hf_repo: ACE-Step/Ace-Step1.5
    command: >
      /usr/bin/env PORT={port} /home/kevyn/projects/model-router/deploy/acestep-shim/run.sh
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES=0", "HF_HOME=/opt/ai/hf/acestep"]
    vram_mb: 17000
    device: 0
    spin_up_seconds: 120
    api_type: audio_gen
    capabilities: [audio_out]
    match: {path_default: true}
    health_check: /health
    idle_ttl_seconds: 300
    slots: 1
    unlisted: false
    port: 5941
  # SenseNova-U1.6 8B-MoT — text-to-image / image-editing (Apache-2.0), served by a local
  # adapter over the reference SenseNova-U1 python runtime (~/projects/sensenova-u1-adapter),
  # not by llama.cpp or sd.cpp. The official server route (LightLLM+LightX2V) is an
  # H100-class Docker stack; this is the contained equivalent for one card.
  # INT8 ConvRot W8A8 (18.87 GB) is the variant that fits a 24 GB 3090: its matmul is
  # torch._int_mm, i.e. plain INT8 tensor cores. FP8 would need sm_89+ (the 3090 is sm_86).
  # It needs ~19 GB of weights, so admission evicts the 3090's small residents to fit it;
  # they reload on demand afterwards. device "0" pins it to the 3090 (the V100s stay with
  # qwen38-flash-next). Traces to POST /sdapi/v1/txt2img; health is GET /v1/models.
  - model_id: sensenova-u1.6-8b-mot
    name: "SenseNova-U1.6 8B-MoT (text-to-image, INT8 ConvRot W8A8, RTX 3090)"
    hf_repo: sensenova/SenseNova-U1.6-8B-MoT-Native
    aliases: [sensenova-u1.6, sensenova-t2i]
    command: >
      /home/kevyn/projects/sensenova-u1-adapter/runtime/.venv/bin/python
      /home/kevyn/projects/sensenova-u1-adapter/adapter/sensenova_server.py
      --host 127.0.0.1 --port {port}
      --model-path /home/kevyn/models/sensenova-u1.6-8b-mot-native/SenseNova-U1.6-INT8-ConvRot-W8A8.safetensors
    env: ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "CUDA_VISIBLE_DEVICES={gpu}"]
    vram_mb: 22000
    device: "0"
    spin_up_seconds: 300
    api_type: image
    # The playground's image tab gates Edit on "img2img" and Outpaint on "inpaint"
    # (internal/router/ui/app.js imageModeState). Without these the stanza
    # publishes capabilities: [] and both modes are disabled in the UI even
    # though the adapter serves them. The adapter's own /v1/models advertises
    # [txt2img, img2img, edit, inpaint, outpaint]; the router only republishes
    # what the stanza declares, so this list must be kept in step by hand.
    capabilities: [img2img, inpaint]
    match: {path_prefix: /sdapi/v1}
    health_check: /v1/models
    idle_ttl_seconds: 300
    unlisted: false
    port: 5929


