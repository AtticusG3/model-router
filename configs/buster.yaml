    aliases: [coding-pool]
    command: >
      /opt/ai/bin/llama-server
      --model /home/kevyn/models/Qwen3.8-27B-UD-Q5_K_XL.gguf
      --mmproj /home/kevyn/models/mmproj-Qwen3.8-27B-UD-F16.gguf
