      --n-gpu-layers 999
      --ctx-size 262144 --threads 6 --parallel 1 --cont-batching --flash-attn on --mlock --no-mmap
      --cache-type-k turbo4 --cache-type-v turbo4
      --cache-reuse 256 --batch-size 512 --ubatch-size 512 --metrics
      --spec-type draft-mtp --spec-draft-n-max 4
      --n-predict 65536 --reasoning-budget 53248 --reasoning-budget-message "[[SYSTEM] You have run out of thinking time. Stop reasoning immediately and provide your final code solution now, based on your best understanding so far.]"
      --temperature 0.6 --top-p 0.95 --top-k 20 --min-p 0.0
      --split-mode none --device CUDA0
    env: ["CUDA_VISIBLE_DEVICES=1"]
    vram_mb: 26600
    device: 1
    spin_up_seconds: 120
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: true
    port: 5913

  - model_id: qwen3.6-35b-a3b
