# kev-9b -- example decision stanza (#225). Not a node config: no node loads
# this file. Copy the stanza into a node's config when the rollout ticket runs.
#
# Kev-9B is a prefill-only decision model (System One API, POST /v1/systemone).
# Upstream llama.cpp added /v1/systemone in PR #29818, picking decision mode
# from the GGUF metadata with no extra flag.
#
# Runtime note (smoke test 2026-11-26 on buster): /opt/ai/bin/llama-server
# points to llama.cpp-unified (10881 / 1b7891845), which does NOT have
# /v1/systemone compiled in. Use the llama.cpp-olala build
# (0.5.0-dev / 55c22dc) until /opt/ai/bin/llama-server is rebuilt on a
# post-PR-#29818 base.
#
# Weights: Kev-9B-BF16.gguf (17.9 GB, sha256 7097686ceab17858c478644e14bee187b5bec775fe4fd6a14aaf02715a903f0a)
# from ggml-org/Kev-9B-GGUF (.src_sha db029f08, weights unchanged from b5d8c18e).
# Measured on buster's RTX 3090: 16,532 MiB VRAM, 111.6 ms p50 (3 questions),
# 35.4 ms p50 (1 choice question).
# Research and verdicts: docs/research/decision-models.md. Design: docs/adr/0004.

listen: 127.0.0.1:8081
start_port: 5901

stanzas:
  - model_id: kev-9b
    name: "Kev 9B (decision, System One)"
    params: 9B
    hf_repo: ggml-org/Kev-9B-GGUF
    aliases: [kev]
    command: >
      /home/kevyn/infra/llama.cpp-olala/build/bin/llama-server
      --model /opt/ai/models/decision/Kev-9B-BF16.gguf
      --port {port} --host 127.0.0.1
      --n-gpu-layers 999
      --ctx-size 16384 --parallel 1
      --flash-attn on
    vram_mb: 17000  # measured 16,532 MiB on buster RTX 3090 (--ctx-size 16384 --parallel 1 --flash-attn on)
    spin_up_seconds: 120
    api_type: decision
    decision_style: systemone
    health_check: /health
    idle_ttl_seconds: 900
