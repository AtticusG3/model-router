# gareths-homelab -- model-router v0.1 staged config (replaces llama-swap on
# 127.0.0.1:18080; nginx :8081 (LLM) / :8082 (image) -> 18080).
# GPU: RTX 5060 Ti 16GB. LLM GGUF (TurboQuant builds) + SDXL sd.cpp.
# Waldron naming convention kept (-waldron suffix).
#
# All commands transcribed from llama-swap.yaml (replacing ${PORT} with {port}).
#
# nginx: the existing server blocks proxy :8081/:8082 -> 127.0.0.1:18080. Ensure
# `proxy_buffering off;` is set for /v1/chat/completions (SSE) -- the router
# also sets X-Accel-Buffering: no as a safeguard.

listen: 127.0.0.1:18080
start_port: 5801

reserved_ports: [8081, 8082]

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [gemma-4-26b-a4b]   # matches llama-swap's on_startup preload

stanzas:
  - model_id: gemma-4-26b-a4b
    name: "Gemma 4 26B A4B"
    aliases: [llm-gemma-waldron]
    command: >
      /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/llama-cpp-turboquant/build/bin/llama-server
      --model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/gemma4/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
      --mmproj /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/gemma4/mmproj-F16.gguf
      --model-draft /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/gemma4/mtp-gemma-4-26B-A4B-it-Q8_0.gguf
      --port {port}
      --host 127.0.0.1
      --ctx-size 262144
      --threads 8
      --parallel 1
      --cont-batching
      --mlock
      --flash-attn on
      --cache-type-k turbo4
      --cache-type-v turbo2
      --spec-type draft-mtp
      --spec-draft-cpu-moe
      --reasoning-budget 24000 --reasoning-budget-message "[SYSTEM You have run out of thinking time. Stop reasoning immediately and provide your final code solution now, based on your best understanding so far.]"
    vram_mb: 15000        # 26B A4B Q4 fits the 16GB 5060 Ti with room
    device: 0
    spin_up_seconds: 120
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: false
    port: 5801

