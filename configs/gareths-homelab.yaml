# gareths-homelab -- model-router on 127.0.0.1:18080
# (nginx :8081 LLM / :8082 image -> 18080). GPU: RTX 5060 Ti 16GB.
#
# vram_mb is nvidia-smi used rounded up after a successful ladder load.
# 2026-08-21: qwen3.6-35b-a3b one 256k turbo4 slot (used=14732).
# Two 256k slots did not pay real KV on 16GB. intent used=1278.
# 2026-08-30: 256k left ~300MB free with intent+qwen and CUDA-graph OOM
# aborted the host. Stepped 35B models to 128k for KV headroom.
# 2026-09-01: removed ornith entirely (MTP+mlock on 16GB locked the host).

listen: 127.0.0.1:18080
start_port: 5801
reserved_ports: [8081, 8082]

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: []

stanzas:
  - model_id: qwen2.5-1.5b-instruct
    name: "Qwen2.5 1.5B Instruct (intent router)"
    aliases: [llm-intent-router-waldron, intent-model, intent-router]
    command: >
      /opt/ai/bin/llama-server
      --model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/intent-router/qwen2.5-1.5b-instruct-q4_k_m.gguf
      --port {port}
      --host 127.0.0.1
      --ctx-size 8192
      --threads 2
      --parallel 2
      --cont-batching
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --metrics
      --temperature 0.1 --top-p 0.9 --top-k 20 --min-p 0.0
    vram_mb: 1500
    device: 0
    spin_up_seconds: 30
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: false
    port: 5807

  - model_id: qwen3.6-35b-a3b
    name: "Qwen 3.6 35B A3B Compact"
    aliases: [llm-qwen-waldron, daily-driver, daily-model, qwen3.6-35b, qwen3.6-35b-a3b-heretic-quality]
    command: >
      /opt/ai/bin/llama-server
      --model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/qwen36/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-I-Compact.gguf
      --port {port}
      --host 127.0.0.1
      --ctx-size 131072
      --threads 8
      --parallel 1
      --cont-batching
      --load-mode mlock
      --flash-attn on
      --cache-type-k turbo4
      --cache-type-v turbo4
      --fit on --fit-target 1024
      --jinja --chat-template-file /opt/ai/config/qwen-fixed-chat-template.jinja
      --reasoning-format deepseek
      --reasoning-budget 24000 --reasoning-budget-message "[SYSTEM You have run out of thinking time. Stop reasoning immediately and provide your final code solution now, based on your best understanding so far.]"
    vram_mb: 14000
    device: 0
    spin_up_seconds: 120
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: false
    port: 5803

  - model_id: qwen3.6-35b-a3b-nvfp4
    name: "Qwen 3.6 35B A3B NVFP4 (FreeToken)"
    aliases: [llm-qwen-freetoken, qwen3.6-nvfp4, freetoken-qwen, qwen3.6-35b-nvfp4]
    command: >
      /root/freetoken/.venv/bin/ft serve
      --model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/qwen36-nvfp4
      --host 127.0.0.1
