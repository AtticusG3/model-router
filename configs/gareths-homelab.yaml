# gareths-homelab -- model-router on 127.0.0.1:18080
# (nginx :8081 LLM / :8082 image -> 18080). GPU: RTX 5060 Ti 16GB.
#
# vram_mb is nvidia-smi used rounded up after a successful ladder load.
# 2026-08-20: qwen3.6-35b-a3b needed 128k turbo4, no mmproj, no MTP
# (used=14764). ornith compact kept 256k f16 MTP+mmproj (used=14660).
# intent used=1278. qwen3.6 uses /opt/ai/config/qwen-fixed-chat-template.jinja.

listen: 127.0.0.1:18080
start_port: 5801
reserved_ports: [8081, 8082]

telemetry:
  poll_seconds: 2
  peer_sync_seconds: 5
  peer_stale_seconds: 15

preload: [qwen2.5-1.5b-instruct]

stanzas:
  - model_id: qwen2.5-1.5b-instruct
    name: "Qwen2.5 1.5B Instruct (intent router)"
    aliases: [llm-intent-router-waldron, intent-model, intent-router]
    command: >
      /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/llama-cpp-turboquant/build/bin/llama-server
      --model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/intent-router/qwen2.5-1.5b-instruct-q4_k_m.gguf
      --port {port}
      --host 127.0.0.1
      --ctx-size 8192
      --threads 2
      --parallel 2
      --cont-batching
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --metrics
      --temperature 0.1 --top-p 0.9 --top-k 20 --min-p 0.0
    vram_mb: 1500
    device: 0
    spin_up_seconds: 30
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 0
    unlisted: false
    port: 5807

  - model_id: qwen3.6-35b-a3b
    name: "Qwen 3.6 35B A3B Compact"
    aliases: [llm-qwen-waldron, daily-driver, daily-model, qwen3.6-35b, qwen3.6-35b-a3b-heretic-quality]
    command: >
      /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/llama-cpp-turboquant/build/bin/llama-server
      --model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/qwen36/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-I-Compact.gguf
      --port {port}
      --host 127.0.0.1
      --ctx-size 131072
      --threads 8
      --parallel 1
      --cont-batching
      --mlock
      --no-mmap
      --flash-attn on
      --cache-type-k turbo4
      --cache-type-v turbo4
      --jinja --chat-template-file /opt/ai/config/qwen-fixed-chat-template.jinja
      --reasoning-format deepseek
      --reasoning-budget 24000 --reasoning-budget-message "[SYSTEM You have run out of thinking time. Stop reasoning immediately and provide your final code solution now, based on your best understanding so far.]"
    vram_mb: 15200
    device: 0
    spin_up_seconds: 120
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: false
    port: 5803

  - model_id: ornith-1.0-35b
    name: "Ornith-1.0-35B Compact"
    aliases: [llm-ornith-waldron, ornith-1.0-35b-compact]
    command: >
      /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/llama-cpp-turboquant/build/bin/llama-server
      --model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/ornith-model/Ornith-1.0-35B-MTP-APEX-I-Compact.gguf
      --mmproj /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/llama-cpp/models/ornith-model/mmproj-F16.gguf
      --port {port}
      --host 127.0.0.1
      --ctx-size 262144
      --threads 8
      --parallel 1
      --cont-batching
      --mlock
      --no-mmap
      --flash-attn on
      --cache-type-k f16
      --cache-type-v f16
      --spec-type draft-mtp
      --reasoning-budget 24000 --reasoning-budget-message "[SYSTEM You have run out of thinking time. Stop reasoning immediately and provide your final code solution now, based on your best understanding so far.]"
    vram_mb: 15100
    device: 0
    spin_up_seconds: 120
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 300
    unlisted: false
    port: 5808

  - model_id: krea-2-turbo
    name: "Krea 2.0 Turbo"
    command: >
      /opt/ai/bin/sd-server
      --diffusion-model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/krea2/Krea-2-Turbo-Q8_0.gguf
      --llm /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/krea2/Qwen3VL-4B-Instruct-Q4_K_M.gguf
      --vae /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/krea2/wan_2.1_vae.safetensors
      --mmap --max-vram 12 --rng cuda --vae-tiling --fa --offload-to-cpu
      --steps 8 --cfg-scale 2.0 --seed -1
      -l 0.0.0.0 --listen-port {port}
    vram_mb: 12000
    device: 0
    spin_up_seconds: 60
    api_type: image
    match: {path_prefix: /sdapi/v1, path_default: true}
    health_check: /sdapi/v1/sd-models
    idle_ttl_seconds: 300
    unlisted: false
    port: 5821

  - model_id: z-anime-turbo
    name: "Z-Anime Turbo (8-step GGUF)"
    aliases: [z-anime, z-anime-waldron]
    command: >
      /opt/ai/bin/sd-server
      --diffusion-model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/z-image-turbo/Z-Anime-8steps.q5_0.gguf
      --vae /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/z-image-turbo/ae.safetensors
      --llm /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/z-image-turbo/Qwen3-4b-Z-Image-Turbo-AbliteratedV1.i1-Q4_K_M.gguf
      --mmap --max-vram 12 --rng cuda --vae-tiling --fa --offload-to-cpu
      --sampling-method euler_a --scheduler sgm_uniform
      --steps 8 --cfg-scale 1.0 --seed -1
      -W 1024 -H 1024
      -l 0.0.0.0 --listen-port {port}
    vram_mb: 9000
    device: 0
    spin_up_seconds: 60
    api_type: image
    match: {path_prefix: /sdapi/v1}
    health_check: /sdapi/v1/sd-models
    idle_ttl_seconds: 300
    unlisted: false
    port: 5823

  - model_id: ideogram4
    name: "Ideogram 4"
    command: >
      /opt/ai/bin/sd-server
      --diffusion-model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/ideogram4/ideogram4-Q8_0.gguf
      --uncond-diffusion-model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/ideogram4/ideogram4_uncond-Q8_0.gguf
      --llm /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/ideogram4/Qwen3-VL-8B-Instruct-Q4_K_M.gguf
      --vae /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/ideogram4/flux2-vae.safetensors
      --mmap --max-vram 12 --rng cuda --vae-tiling --fa --offload-to-cpu
      --seed -1
      -W 1024 -H 1024
      -l 0.0.0.0 --listen-port {port}
    vram_mb: 14000
    device: 0
    spin_up_seconds: 60
    api_type: image
    match: {path_prefix: /sdapi/v1}
    health_check: /sdapi/v1/sd-models
    idle_ttl_seconds: 300
    unlisted: false
    port: 5827

  - model_id: sdxl-lightning
    name: "Waldron SDXL Lightning (Juggernaut XI)"
    aliases: [sdxl-lightning-waldron]
    command: >
      /opt/ai/bin/sd-server
      --model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/sdxl/Juggernaut-XI-byRunDiffusion-Lightning.safetensors
      -l 0.0.0.0 --listen-port {port}
    vram_mb: 9000
    device: 0
    spin_up_seconds: 60
    api_type: image
    match: {path_prefix: /sdapi/v1}
    health_check: /sdapi/v1/sd-models
    idle_ttl_seconds: 300
    unlisted: false
    port: 5822

  - model_id: sdxl-juggernaut-xi
    name: "Waldron SDXL Photo Edit (Juggernaut XI img2img)"
    aliases: [photo-edit-waldron]
    command: >
      /opt/ai/bin/sd-server
      --model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/sdxl/Juggernaut-XI-byRunDiffusion.safetensors
      --clip_l /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/sdxl/clip_l.safetensors
      --clip_g /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/sdxl/clip_g.safetensors
      --mmap --max-vram -1 --rng cuda --vae-tiling --fa
      --sampling-method dpm++2m --scheduler karras
      --steps 30 --cfg-scale 4.5 --seed -1
      -W 1024 -H 1024
      -l 0.0.0.0 --listen-port {port}
    vram_mb: 9000
    device: 0
    spin_up_seconds: 60
    api_type: image
    match: {path_prefix: /sdapi/v1}
    health_check: /sdapi/v1/sd-models
    idle_ttl_seconds: 300
    unlisted: false
    port: 5824

  - model_id: z-image-juggernaut-fast
    name: "Waldron Juggernaut Z Fast (4-step GGUF)"
    aliases: [juggernaut-z-waldron]
    command: >
      /opt/ai/bin/sd-server
      --diffusion-model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/z-image-turbo/Juggernaut_Z_V1_Fast_by_RunDiffusion_q8_0.gguf
      --vae /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/z-image-turbo/ae.safetensors
      --llm /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/z-image-turbo/Qwen3-4b-Z-Image-Turbo-AbliteratedV1.i1-Q4_K_M.gguf
      --mmap --max-vram -1 --rng cuda --vae-tiling --fa
      --sampling-method res_multistep --scheduler simple
      --steps 4 --cfg-scale 2.0 --seed -1
      -W 1024 -H 1024
      -l 0.0.0.0 --listen-port {port}
    vram_mb: 9000
    device: 0
    spin_up_seconds: 60
    api_type: image
    match: {path_prefix: /sdapi/v1}
    health_check: /sdapi/v1/sd-models
    idle_ttl_seconds: 300
    unlisted: false
    port: 5825

  - model_id: z-image
    name: "Waldron Z Image base (Q8 GGUF)"
    aliases: [z-image-waldron]
    command: >
      /opt/ai/bin/sd-server
      --diffusion-model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/z-image-turbo/z-image-Q8_0.gguf
      --vae /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/z-image-turbo/ae.safetensors
      --llm /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/z-image-turbo/Qwen3-4b-Z-Image-Turbo-AbliteratedV1.i1-Q4_K_M.gguf
      --mmap --max-vram -1 --rng cuda --vae-tiling --fa
      --sampling-method res_multistep --scheduler simple
      --steps 50 --cfg-scale 4.0 --seed -1
      -W 1024 -H 1024
      -l 0.0.0.0 --listen-port {port}
    vram_mb: 9000
    device: 0
    spin_up_seconds: 60
    api_type: image
    match: {path_prefix: /sdapi/v1}
    health_check: /sdapi/v1/sd-models
    idle_ttl_seconds: 300
    unlisted: false
    port: 5826

  - model_id: flux2-klein
    name: "Flux.2 Klein (Waldron)"
    aliases: [flux2-klein-waldron]
    command: >
      /opt/ai/bin/sd-server
      --diffusion-model /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/flux2-klein/flux-2-klein-9b-Q4_0.gguf
      --vae /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/flux2-klein/flux2-vae.safetensors
      --llm /srv/dev-disk-by-uuid-abf69297-f944-4276-b8b1-5ef03fcdc8e8/sd-cpp-models/flux2-klein/flux2-klein-9b-uncensored-q4_k_m.gguf
      --mmap --max-vram -1 --rng cuda --vae-tiling --fa
      --steps 4 --cfg-scale 1.0 --seed -1
      -W 1024 -H 1024
      -l 0.0.0.0 --listen-port {port}
