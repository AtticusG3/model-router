  # CaptionSmith ASR + Demucs live in the captionsmith-engine container, not
  # llama-server. This stanza is a VRAM reservation: requesting the model
  # evicts the resident 35B so Qwen3-ASR + ForcedAligner (or Whisper) can load.
  # vram_mb covers 1.7B ASR + 0.6B aligner + htdemucs.
  - model_id: anime-whisper-faster
    name: "CaptionSmith ASR (VRAM slot)"
    aliases: [captionsmith-whisper, captionsmith-asr, flyfront/anime-whisper-faster, Systran/faster-whisper-large-v3]
    command: >
      /usr/bin/python3 /opt/ai/bin/vram-slot-http {port}
    vram_mb: 7500
    device: 0
    spin_up_seconds: 10
    api_type: chat
    match: {body_field: model}
    health_check: /health
    idle_ttl_seconds: 120
    unlisted: false
    port: 5810

