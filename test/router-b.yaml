# Router B — smoke test config (peer for router A)
listen: 0.0.0.0:18100
start_port: 5910
telemetry:
  poll_seconds: 2
  peer_sync_seconds: 3
  peer_stale_seconds: 15

stanzas:
  - model_id: remote-model
    name: "Fake Remote Model"
    command: "build/fake-model --port {port} --model remote-model"
    vram_mb: 0
    spin_up_seconds: 10
    api_type: chat
    health_check: /health
    idle_ttl_seconds: 30
